<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNO Events Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital,wght@0,400;0,700;1,400;1,700&family=Karla:wght@400;700&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>The Sidekick's Entertainment Calendar</h1>
<h2>October</h2>
<div id="calendar" class="calendar"></div>

<div id="overlay" class="event-overlay"></div>
  
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzwvWHbDDeFjdcproY4d2jmR3uwGq6YWNy_-dvAgvQlsd4Jij3IkEVqMleSb9Y8CN1tng/exec"

// generate basic month calendar
const now = new Date();
const month = now.getMonth();
const year = now.getFullYear();
const firstDay = new Date(year, month, 1).getDay();
const daysInMonth = new Date(year, month + 1, 0).getDate();

const calendar = document.getElementById('calendar');
const headers = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
headers.forEach(h => {
  const div = document.createElement('div');
  div.className = 'header';
  div.textContent = h;
  calendar.appendChild(div);
});

for (let i = 0; i < firstDay; i++) {
  const div = document.createElement('div');
  div.className = 'day empty';
  calendar.appendChild(div);
}

for (let d = 1; d <= daysInMonth; d++) {
  const div = document.createElement('div');
  div.className = 'day';
  div.innerHTML = `<strong>${d}</strong>`;
  div.id = `day-${d}`;
  calendar.appendChild(div);
}
const overlay = document.getElementById('overlay');

fetch(SHEET_URL)
  .then(r => r.json())
  .then(events => {
    events.forEach(ev => {
      const date = new Date(ev.Date);
      if (date.getMonth() === month && date.getFullYear() === year) {
        const d = date.getDate();
        const dayCell = document.getElementById(`day-${d}`);
        if (dayCell) {
          const eDiv = document.createElement('div');
          eDiv.className = 'event';
          eDiv.dataset.title = ev.Title;
          eDiv.dataset.description = ev.Description || '';
          eDiv.dataset.link = ev.Link || '';
          eDiv.dataset.images = ev.Images || '';
          eDiv.dataset.stickers = ev.Stickers || '';

          eDiv.innerHTML = `<b>${ev.Title}</b>`;

          // Click to expand
          eDiv.addEventListener('click', () => {
            eDiv.classList.add('expanded');

            // Clear current content
            eDiv.innerHTML = `<b>${eDiv.dataset.title}</b><br>${eDiv.dataset.description}`;
            
            if (eDiv.dataset.link) {
              eDiv.innerHTML += `<br><a href="${eDiv.dataset.link}" target="_blank" style="color:white; text-decoration:underline;">Details</a>`;
            }

            // Add images
            if (eDiv.dataset.images) {
              const imgs = eDiv.dataset.images.split(',');
              imgs.forEach(src => {
                const imgEl = document.createElement('img');
                imgEl.src = src.trim();
                eDiv.appendChild(imgEl);
              });
            }

            // Add stickers
            if (eDiv.dataset.stickers) {
              const stickerDiv = document.createElement('div');
              stickerDiv.className = 'stickers';
              stickerDiv.textContent = eDiv.dataset.stickers;
              eDiv.appendChild(stickerDiv);
            }

            overlay.style.display = 'block';
          });

          dayCell.appendChild(eDiv);
        }
      }
    });
  });

// Close expanded event when clicking overlay
overlay.addEventListener('click', () => {
  const expanded = document.querySelector('.event.expanded');
  if (expanded) {
    // Restore original compact title view
    expanded.innerHTML = `<b>${expanded.dataset.title}</b>`;
    expanded.classList.remove('expanded');
  }
  overlay.style.display = 'none';
});

</script>
</body>
</html>
