<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNO Events Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital,wght@0,400;0,700;1,400;1,700&family=Karla:wght@400;700&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Events Calendar</h1>
<div id="calendar" class="calendar"></div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzwvWHbDDeFjdcproY4d2jmR3uwGq6YWNy_-dvAgvQlsd4Jij3IkEVqMleSb9Y8CN1tng/exec"

// generate basic month calendar
const now = new Date();
const month = now.getMonth();
const year = now.getFullYear();
const firstDay = new Date(year, month, 1).getDay();
const daysInMonth = new Date(year, month + 1, 0).getDate();

const calendar = document.getElementById('calendar');
const headers = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
headers.forEach(h => {
  const div = document.createElement('div');
  div.className = 'header';
  div.textContent = h;
  calendar.appendChild(div);
});

for (let i = 0; i < firstDay; i++) {
  const div = document.createElement('div');
  div.className = 'day empty';
  calendar.appendChild(div);
}

for (let d = 1; d <= daysInMonth; d++) {
  const div = document.createElement('div');
  div.className = 'day';
  div.innerHTML = `<strong>${d}</strong>`;
  div.id = `day-${d}`;
  calendar.appendChild(div);
}

fetch(SHEET_URL)
  .then(r => r.json())
  .then(events => {
    events.forEach(ev => {
      const date = new Date(ev.Date);
      if (date.getMonth() === month && date.getFullYear() === year) {
        const d = date.getDate();
        const dayCell = document.getElementById(`day-${d}`);
        if (dayCell) {
          const eDiv = document.createElement('div');
          eDiv.className = 'event';
          eDiv.innerHTML = `<b>${ev.Title}</b><br>${ev.Description || ''}`;
          if (ev.Link) {
            eDiv.innerHTML += `<br><a href="${ev.Link}" target="_blank">Details</a>`;
          }
          dayCell.appendChild(eDiv);
        }
      }
    });
  });
</script>
</body>
</html>
